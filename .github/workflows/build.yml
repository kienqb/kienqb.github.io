name: Build CYD firmware

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware (ESP32, CYD 2.8")
        shell: bash
        working-directory: waze-hud
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . $IDF_PATH/export.sh
          idf.py set-target esp32
          idf.py build

      - name: Merge into one flashable .bin (flash at 0x0)
        shell: bash
        working-directory: waze-hud/build
        run: |
          . $IDF_PATH/export.sh
          python -m esptool --chip esp32 merge_bin -o ../WazeHUD-CYD-custom.bin @flash_args
          ls -l ../WazeHUD-CYD-custom.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: WazeHUD-CYD-custom
          path: waze-hud/WazeHUD-CYD-custom.bin
